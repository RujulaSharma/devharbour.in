services:
  - type: web
    name: devharbour-backend
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build:vercel
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: DB_PROVIDER
        value: postgresql
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGINS
        value: https://devharbour.in,https://www.devharbour.in
      - key: APP_BASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: DevHarbour <verify@auth.devharbour.in>
      - key: EMAIL_VERIFICATION_SECRET
        sync: false
