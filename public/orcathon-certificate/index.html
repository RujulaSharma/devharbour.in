<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Orcathon Participation Certificate | Dev Harbour</title>
  <link rel="stylesheet" href="/assets/certificate-workspace.css?v=reference-2026">
</head>
<body>
  <header>
    <a href="/profile">← My Profile</a>
    <h1>Orcathon Participation Certificate</h1>
    <p>Your official certificate, ready to personalise and download.</p>
  </header>
  <main>
    <figure class="certificate" aria-label="Orcathon participation certificate preview">
      <svg id="certificate-preview" viewBox="0 0 1024 725" role="img" aria-label="Orcathon participation certificate"></svg>
    </figure>
    <aside>
      <h2>Your certificate</h2>
      <p id="status" role="status" aria-live="polite">Checking eligibility…</p>
      <form id="name-form" hidden>
        <label for="name">Name on your certificate</label>
        <input id="name" name="name" autocomplete="name" maxlength="100" minlength="2" required>
        <p class="privacy-note">Editing this name changes your certificate only. Your verified email and event registration stay the same.</p>
        <button id="save" disabled>Save name &amp; regenerate</button>
      </form>
      <button id="download" type="button" disabled hidden>Download PDF</button>
      <button id="share" type="button" class="secondary" disabled>Copy verification link</button>
      <p class="back-link"><a href="/profile">View certificates on my profile</a></p>
    </aside>
  </main>
  <script src="/assets/certificate-workspace.js?v=reference-2026" defer></script>
  <script src="/assets/orcathon-certificate.js?v=reference-2026" defer></script>
</body>
</html>
