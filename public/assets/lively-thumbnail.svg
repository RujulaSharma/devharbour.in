<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="livelyBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101116"/>
      <stop offset="50%" stop-color="#181a24"/>
      <stop offset="100%" stop-color="#0e0f14"/>
    </linearGradient>

    <!-- Warm Amber / Gold Gradient -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Coral Rose Accent -->
    <linearGradient id="roseAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Paper Surface Gradient -->
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fcfbfa"/>
      <stop offset="100%" stop-color="#f3efe6"/>
    </linearGradient>

    <!-- Glass Overlay -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.09)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(245,158,11,0.5)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(251,113,133,0.3)"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Fine Book Paper Grid -->
    <pattern id="paperGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="300" fill="url(#livelyBg)"/>
  <rect width="600" height="300" fill="url(#paperGrid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="140" cy="140" r="130" fill="#f59e0b" opacity="0.12" filter="blur(40px)"/>
  <circle cx="470" cy="150" r="140" fill="#fb7185" opacity="0.1" filter="blur(45px)"/>
  <circle cx="300" cy="230" r="90" fill="#d97706" opacity="0.08" filter="blur(35px)"/>

  <!-- Background Decorative Quotation Marks -->
  <g opacity="0.08" transform="translate(60, 40)">
    <text x="0" y="160" fill="#ffffff" font-family="Georgia,serif" font-size="220" font-weight="bold">“</text>
  </g>
  <g opacity="0.05" transform="translate(320, 80)">
    <text x="0" y="160" fill="#ffffff" font-family="Georgia,serif" font-size="180" font-weight="bold">”</text>
  </g>

  <!-- Left Main Editorial Card Showcase -->
  <g transform="translate(44, 42)">
    <!-- Floating Journal Card -->
    <rect width="365" height="216" rx="16" fill="url(#glassGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>
    
    <!-- Top Monospace Tagline -->
    <g transform="translate(24, 22)">
      <rect width="180" height="24" rx="12" fill="rgba(245,158,11,0.12)" stroke="#f59e0b" stroke-width="1.2"/>
      <circle cx="12" cy="12" r="3.5" fill="#fbbf24" filter="url(#goldGlow)"/>
      <text x="24" y="16" fill="#fbbf24" font-family="monospace" font-size="10.5" font-weight="700" letter-spacing="1">WRITERS COMMUNITY</text>
    </g>

    <!-- Quotas / Feathers Emblem Right -->
    <g transform="translate(315, 36)" filter="url(#goldGlow)">
      <!-- Stylized Nib / Quill -->
      <path d="M 0 -14 L 14 6 L 5 18 L 0 8 L -5 18 L -14 6 Z" fill="url(#goldGrad)"/>
      <circle cx="0" cy="0" r="3" fill="#ffffff"/>
      <line x1="0" y1="0" x2="0" y2="18" stroke="#ffffff" stroke-width="1.5"/>
    </g>

    <!-- Title & Tagline -->
    <text x="24" y="94" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Plus Jakarta Sans',sans-serif" font-size="28" font-weight="900" letter-spacing="-0.03em">Lively!</text>
    <text x="24" y="118" fill="rgba(255,255,255,0.72)" font-family="Georgia,serif" font-style="italic" font-size="13">"Composes, that make you think."</text>

    <!-- Prose / Poetry Stanza Preview -->
    <g transform="translate(24, 138)" opacity="0.85">
      <!-- Stanza rule lines -->
      <line x1="0" y1="0" x2="160" y2="0" stroke="rgba(255,255,255,0.4)" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="0" y1="10" x2="210" y2="10" stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="20" x2="140" y2="20" stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="30" x2="180" y2="30" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <!-- Categories / Tags Bar -->
    <g transform="translate(24, 186)">
      <rect width="56" height="18" rx="4" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
      <text x="8" y="13" fill="#fdfbf7" font-family="monospace" font-size="9.5" font-weight="600">STORIES</text>

      <rect x="62" y="0" width="50" height="18" rx="4" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
      <text x="70" y="13" fill="#fdfbf7" font-family="monospace" font-size="9.5" font-weight="600">POEMS</text>

      <rect x="118" y="0" width="54" height="18" rx="4" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
      <text x="126" y="13" fill="#fdfbf7" font-family="monospace" font-size="9.5" font-weight="600">QUOTES</text>

      <rect x="178" y="0" width="66" height="18" rx="4" fill="rgba(245,158,11,0.1)" stroke="rgba(245,158,11,0.3)"/>
      <text x="186" y="13" fill="#fbbf24" font-family="monospace" font-size="9.5" font-weight="700">JOURNALS</text>
    </g>
  </g>

  <!-- Right Mobile Device Frame (Android / App Showcase) -->
  <g transform="translate(450, 35)">
    <!-- Smartphone Frame -->
    <rect width="112" height="230" rx="20" fill="#151720" stroke="rgba(255,255,255,0.2)" stroke-width="2" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.6))"/>
    
    <!-- Phone Screen Surface -->
    <rect x="6" y="8" width="100" height="214" rx="14" fill="#1e2029"/>
    
    <!-- Camera Punch Hole -->
    <circle cx="56" cy="18" r="3" fill="#0c0d12"/>

    <!-- App Header Inside Phone Screen -->
    <text x="16" y="40" fill="#ffffff" font-family="-apple-system,sans-serif" font-size="12" font-weight="900">Lively!</text>
    <circle cx="92" cy="36" r="5" fill="#f59e0b"/>

    <!-- Reader Card Inside Phone -->
    <rect x="12" y="52" width="88" height="74" rx="8" fill="#282a36" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <!-- Simulated Poem / Story -->
    <text x="18" y="68" fill="#fbbf24" font-family="Georgia,serif" font-size="9" font-weight="bold">Autumn Reverie</text>
    <line x1="18" y1="78" x2="86" y2="78" stroke="rgba(255,255,255,0.3)" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="18" y1="86" x2="74" y2="86" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="18" y1="94" x2="82" y2="94" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-linecap="round"/>
    <text x="18" y="114" fill="#a1a1aa" font-family="sans-serif" font-size="7.5">1.2k reads · 42 claps</text>

    <!-- Mini Card 2 Inside Phone -->
    <rect x="12" y="134" width="88" height="66" rx="8" fill="#282a36" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="18" y="150" fill="#f43f5e" font-family="Georgia,serif" font-size="8.5" font-weight="bold">Midnight Journal</text>
    <line x1="18" y1="160" x2="80" y2="160" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="18" y1="168" x2="68" y2="168" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Android Home Indicator Bar -->
    <line x1="38" y1="214" x2="74" y2="214" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Top Right Platform Pill Badge -->
  <g transform="translate(515, 14)">
    <rect width="65" height="18" rx="9" fill="rgba(245,158,11,0.15)" stroke="#f59e0b" stroke-width="1"/>
    <text x="32" y="12" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="8.5" font-weight="700">ANDROID</text>
  </g>
</svg>