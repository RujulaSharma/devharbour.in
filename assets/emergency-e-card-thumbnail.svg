<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0a14"/>
      <stop offset="45%" stop-color="#141126"/>
      <stop offset="100%" stop-color="#0a0912"/>
    </linearGradient>
    
    <!-- Neon Emergency Red / Rose -->
    <linearGradient id="neonRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="50%" stop-color="#ff4757"/>
      <stop offset="100%" stop-color="#ff6b81"/>
    </linearGradient>

    <!-- Cyan Beacon Gradient -->
    <linearGradient id="neonCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <!-- Glass Card Surface -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="cardBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,71,87,0.5)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(79,172,254,0.4)"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowPulse" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="600" height="300" fill="url(#bg)"/>
  <rect width="600" height="300" fill="url(#grid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="120" cy="150" r="140" fill="#ff4757" opacity="0.12" filter="blur(40px)"/>
  <circle cx="480" cy="140" r="160" fill="#70a1ff" opacity="0.1" filter="blur(50px)"/>
  <circle cx="300" cy="220" r="100" fill="#ff3366" opacity="0.08" filter="blur(35px)"/>

  <!-- Radar Concentric Rings on Right (GPS / Responders) -->
  <g transform="translate(460, 150)" opacity="0.45">
    <circle r="110" fill="none" stroke="rgba(79,172,254,0.15)" stroke-width="1" stroke-dasharray="4 6"/>
    <circle r="80" fill="none" stroke="rgba(79,172,254,0.25)" stroke-width="1.2"/>
    <circle r="50" fill="none" stroke="rgba(79,172,254,0.4)" stroke-width="1.2" stroke-dasharray="2 4"/>
    <circle r="24" fill="none" stroke="rgba(79,172,254,0.6)" stroke-width="1.5"/>
    <line x1="-120" y1="0" x2="120" y2="0" stroke="rgba(79,172,254,0.2)" stroke-width="1"/>
    <line x1="0" y1="-120" x2="0" y2="120" stroke="rgba(79,172,254,0.2)" stroke-width="1"/>
    
    <!-- Radar Blips (Responders) -->
    <circle cx="35" cy="-28" r="4.5" fill="#00f2fe" filter="url(#glowPulse)"/>
    <circle cx="-42" cy="38" r="3.5" fill="#4facfe"/>
    <circle cx="68" cy="45" r="4" fill="#00f2fe"/>
    <circle cx="-55" cy="-50" r="3" fill="#ff4757"/>
  </g>

  <!-- Main Card Hologram Silhouette (Left/Center) -->
  <g transform="translate(45, 42)">
    <!-- Glass ID Badge Frame -->
    <rect width="360" height="216" rx="16" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.5"/>
    
    <!-- Card Chip / Header Accent -->
    <rect x="24" y="22" width="44" height="32" rx="6" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.2"/>
    <path d="M 24 38 L 68 38 M 46 22 L 46 54" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    
    <!-- SOS Pill Badge -->
    <rect x="80" y="24" width="86" height="24" rx="12" fill="rgba(255,71,87,0.15)" stroke="#ff4757" stroke-width="1.2"/>
    <circle cx="94" cy="36" r="4" fill="#ff3366" filter="url(#glowPulse)"/>
    <text x="106" y="41" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="800" letter-spacing="1.5">SOS LIVE</text>

    <!-- Medical Cross Emblem with Glow -->
    <g transform="translate(300, 40)" filter="url(#glowRed)">
      <rect x="-18" y="-6" width="36" height="12" rx="3" fill="url(#neonRed)"/>
      <rect x="-6" y="-18" width="12" height="36" rx="3" fill="url(#neonRed)"/>
    </g>
    <g transform="translate(300, 40)">
      <rect x="-16" y="-5" width="32" height="10" rx="2.5" fill="#ffffff"/>
      <rect x="-5" y="-16" width="10" height="32" rx="2.5" fill="#ffffff"/>
    </g>

    <!-- Main Project Branding -->
    <text x="24" y="96" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Michroma',sans-serif" font-size="22" font-weight="900" letter-spacing="-0.02em">Emergency E-Card</text>
    <text x="24" y="118" fill="rgba(255,255,255,0.65)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="500">Rapid Medical Profile &amp; Responder Network</text>

    <!-- Live ECG Heartbeat Waveform -->
    <path d="M 24 165 L 75 165 L 85 152 L 95 178 L 108 135 L 122 192 L 134 160 L 145 170 L 155 165 L 336 165" 
          fill="none" stroke="url(#neonRed)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
          filter="url(#glowPulse)"/>

    <!-- Mini Profile Tags at Bottom of Badge -->
    <g transform="translate(24, 185)">
      <rect width="68" height="18" rx="4" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="8" y="13" fill="#ff6b81" font-family="monospace" font-size="10" font-weight="700">BLOOD: O+</text>
      
      <rect x="76" y="0" width="86" height="18" rx="4" fill="rgba(79,172,254,0.08)" stroke="rgba(79,172,254,0.2)"/>
      <text x="84" y="13" fill="#4facfe" font-family="monospace" font-size="10" font-weight="700">GPS: TRACKING</text>

      <rect x="170" y="0" width="76" height="18" rx="4" fill="rgba(0,242,254,0.08)" stroke="rgba(0,242,254,0.2)"/>
      <text x="178" y="13" fill="#00f2fe" font-family="monospace" font-size="10" font-weight="700">ALERT: READY</text>
    </g>
  </g>

  <!-- Location Pin / Signal Beacon on Right (Overlaying Radar) -->
  <g transform="translate(460, 140)">
    <path d="M 0 -24 C -12 -24 -22 -14 -22 -2 C -22 14 0 34 0 34 C 0 34 22 14 22 -2 C 22 -14 12 -24 0 -24 Z" 
          fill="url(#neonRed)" filter="url(#glowRed)"/>
    <circle cx="0" cy="-4" r="8" fill="#ffffff"/>
    <circle cx="0" cy="-4" r="4" fill="#ff3366"/>
  </g>

  <!-- Top Right Watermark Badge -->
  <g transform="translate(520, 26)">
    <rect width="56" height="20" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
    <text x="28" y="14" text-anchor="middle" fill="#00f2fe" font-family="monospace" font-size="9" font-weight="700">WEB APP</text>
  </g>
</svg>