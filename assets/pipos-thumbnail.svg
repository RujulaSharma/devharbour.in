<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <!-- Background Dream Gradients -->
    <linearGradient id="candySky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140f2b"/>
      <stop offset="40%" stop-color="#241442"/>
      <stop offset="75%" stop-color="#3b1b54"/>
      <stop offset="100%" stop-color="#190e30"/>
    </linearGradient>

    <!-- Pastel Dream Clouds & Accents -->
    <linearGradient id="pastelPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7eb3"/>
      <stop offset="100%" stop-color="#ff758c"/>
    </linearGradient>
    <linearGradient id="pastelPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a18cd1"/>
      <stop offset="100%" stop-color="#fbc2eb"/>
    </linearGradient>
    <linearGradient id="pastelCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="candyGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fddb92"/>
      <stop offset="100%" stop-color="#d1fdff"/>
    </linearGradient>
    <linearGradient id="starStore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd200"/>
      <stop offset="100%" stop-color="#f7971e"/>
    </linearGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="pipGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.16)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)"/>
    </linearGradient>

    <!-- Dream Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Dream Grid Pattern -->
    <pattern id="dreamGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.2" fill="rgba(255,255,255,0.08)"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="300" fill="url(#candySky)"/>
  <rect width="600" height="300" fill="url(#dreamGrid)"/>

  <!-- Ambient Pastel Nebulas -->
  <circle cx="120" cy="80" r="130" fill="url(#pastelPink)" opacity="0.22" filter="url(#softGlow)"/>
  <circle cx="480" cy="180" r="150" fill="url(#pastelPurple)" opacity="0.28" filter="url(#softGlow)"/>
  <circle cx="300" cy="280" r="140" fill="url(#pastelCyan)" opacity="0.18" filter="url(#softGlow)"/>

  <!-- Little Cosmos Stars -->
  <g fill="#fff" opacity="0.75">
    <!-- 4-pointed Stars -->
    <path d="M 80 45 Q 80 55 90 55 Q 80 55 80 65 Q 80 55 70 55 Q 80 55 80 45" fill="#fde68a"/>
    <path d="M 230 35 Q 230 42 237 42 Q 230 42 230 49 Q 230 42 223 42 Q 230 42 230 35" fill="#a7f3d0"/>
    <path d="M 520 60 Q 520 70 530 70 Q 520 70 520 80 Q 520 70 510 70 Q 520 70 520 60" fill="#fbcfe8"/>
    <path d="M 390 110 Q 390 115 395 115 Q 390 115 390 120 Q 390 115 385 115 Q 390 115 390 110" fill="#fed7aa"/>
    <path d="M 170 240 Q 170 246 176 246 Q 170 246 170 252 Q 170 246 164 246 Q 170 246 170 240" fill="#e9d5ff"/>
    <circle cx="550" cy="130" r="2" fill="#fff" opacity="0.6"/>
    <circle cx="60" cy="160" r="1.5" fill="#fff" opacity="0.5"/>
    <circle cx="150" cy="90" r="2" fill="#fff" opacity="0.8"/>
    <circle cx="430" cy="40" r="1.8" fill="#fff" opacity="0.7"/>
  </g>

  <!-- Left: Dream Arcade Controller & Story Cloud Card -->
  <g transform="translate(42, 48)">
    <!-- Glass Backdrop -->
    <rect width="250" height="204" rx="20" fill="url(#pipGlass)" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>

    <!-- Category Pill: DREAM ARCADE -->
    <rect x="18" y="18" width="116" height="22" rx="11" fill="rgba(255,126,179,0.22)" stroke="rgba(255,126,179,0.6)" stroke-width="1"/>
    <text x="76" y="33" fill="#ff7eb3" font-family="'Manrope', sans-serif" font-size="10.5" font-weight="800" text-anchor="middle" letter-spacing="0.5">DREAM ARCADE</text>

    <!-- Star XP Badge -->
    <rect x="142" y="18" width="90" height="22" rx="11" fill="rgba(253,219,146,0.18)" stroke="rgba(253,219,146,0.5)" stroke-width="1"/>
    <text x="187" y="33" fill="#ffd700" font-family="'Manrope', sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">★ TIER 3 XP</text>

    <!-- Arcade Mini-Game Canvas Mockup -->
    <rect x="18" y="52" width="214" height="96" rx="14" fill="#1b1233" stroke="rgba(161,140,209,0.3)" stroke-width="1"/>

    <!-- Floating Bedtime Story Cloud -->
    <path d="M 60 90 A 14 14 0 0 1 84 82 A 18 18 0 0 1 112 88 A 14 14 0 0 1 126 100 L 52 100 A 12 12 0 0 1 60 90 Z" fill="#fdf2f8" opacity="0.92"/>
    <text x="86" y="96" fill="#be185d" font-family="'Manrope', sans-serif" font-size="9" font-weight="800">Story Cloud</text>
    <!-- Cute z z z -->
    <text x="126" y="80" fill="#f472b6" font-family="'Manrope', sans-serif" font-size="11" font-weight="800" opacity="0.85">z</text>
    <text x="134" y="73" fill="#f472b6" font-family="'Manrope', sans-serif" font-size="9" font-weight="800" opacity="0.7">z</text>

    <!-- Candy Arcade D-Pad -->
    <g transform="translate(42, 114)">
      <rect x="0" y="7" width="26" height="10" rx="3" fill="#ec4899"/>
      <rect x="8" y="0" width="10" height="24" rx="3" fill="#ec4899"/>
      <circle cx="13" cy="12" r="2.5" fill="#fdf2f8"/>
    </g>

    <!-- Lullaby Music Box Notes -->
    <g transform="translate(112, 114)">
      <circle cx="6" cy="18" r="4.5" fill="#38bdf8"/>
      <circle cx="22" cy="14" r="4.5" fill="#38bdf8"/>
      <path d="M 10 18 L 10 6 L 26 2 L 26 14 M 10 10 L 26 6" stroke="#38bdf8" stroke-width="2" fill="none"/>
    </g>

    <!-- Arcade Action Candy Buttons (A/B/X/Y) -->
    <g transform="translate(182, 112)">
      <circle cx="16" cy="6" r="6" fill="#f43f5e"/>
      <circle cx="28" cy="16" r="6" fill="#10b981"/>
      <circle cx="4" cy="16" r="6" fill="#3b82f6"/>
      <circle cx="16" cy="26" r="6" fill="#fbbf24"/>
    </g>

    <!-- Bottom Feature Chips -->
    <g transform="translate(18, 160)">
      <!-- Music Box -->
      <rect x="0" y="0" width="98" height="26" rx="8" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.3)"/>
      <text x="49" y="17" fill="#7dd3fc" font-family="'Manrope', sans-serif" font-size="10" font-weight="700" text-anchor="middle">♫ Music Box</text>

      <!-- Dream Journal -->
      <rect x="106" y="0" width="108" height="26" rx="8" fill="rgba(244,114,182,0.12)" stroke="rgba(244,114,182,0.3)"/>
      <text x="160" y="17" fill="#f472b6" font-family="'Manrope', sans-serif" font-size="10" font-weight="700" text-anchor="middle">📖 Dream Journal</text>
    </g>
  </g>

  <!-- Right: Companion Pip (Junior Dream Engineer) & Title -->
  <g transform="translate(322, 42)">
    <!-- Brand Badges -->
    <g transform="translate(0, 10)">
      <rect x="0" y="0" width="138" height="22" rx="11" fill="rgba(167,139,250,0.2)" stroke="rgba(167,139,250,0.5)" stroke-width="1"/>
      <text x="69" y="15" fill="#c4b5fd" font-family="'Manrope', sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="0.4">MIDNIGHT NURSERY</text>
    </g>

    <!-- Title: PipOS -->
    <text x="0" y="72" fill="#ffffff" font-family="'Manrope', 'Segoe UI', sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">PipOS</text>
    <!-- Subtitle: Candy Dreams -->
    <text x="110" y="72" fill="url(#pastelPink)" font-family="'Manrope', 'Segoe UI', sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">— Candy Dreams</text>

    <!-- Tagline description -->
    <text x="0" y="98" fill="#e2e8f0" font-family="'Manrope', sans-serif" font-size="13" font-weight="500" opacity="0.9">
      Junior Dream Engineer · 5 Arcade Mini-Games · Star Store
    </text>

    <!-- Companion Pip Character Illustration -->
    <g transform="translate(10, 116)">
      <!-- Soft Dream Aura -->
      <circle cx="48" cy="48" r="44" fill="url(#pastelPurple)" opacity="0.35" filter="url(#glow)"/>

      <!-- Pip Body: Adorable Dream Engineer Puff -->
      <circle cx="48" cy="50" r="36" fill="url(#candyGold)"/>

      <!-- Engineer Goggles / Cap -->
      <path d="M 24 38 Q 48 24 72 38" stroke="#6366f1" stroke-width="5" stroke-linecap="round" fill="none"/>
      <!-- Left Goggle Lens -->
      <circle cx="37" cy="36" r="9" fill="#1e1b4b" stroke="#818cf8" stroke-width="2.5"/>
      <circle cx="39" cy="34" r="2.5" fill="#67e8f9"/>
      <!-- Right Goggle Lens -->
      <circle cx="59" cy="36" r="9" fill="#1e1b4b" stroke="#818cf8" stroke-width="2.5"/>
      <circle cx="61" cy="34" r="2.5" fill="#67e8f9"/>

      <!-- Pip Star Antenna -->
      <path d="M 48 26 L 48 10" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
      <path d="M 48 4 Q 48 8 52 8 Q 48 8 48 12 Q 48 8 44 8 Q 48 8 48 4" fill="#fbbf24"/>

      <!-- Rosy Cheeks -->
      <ellipse cx="30" cy="56" rx="5" ry="3" fill="#f43f5e" opacity="0.6"/>
      <ellipse cx="66" cy="56" rx="5" ry="3" fill="#f43f5e" opacity="0.6"/>

      <!-- Happy Smile -->
      <path d="M 43 55 Q 48 61 53 55" stroke="#475569" stroke-width="2.2" stroke-linecap="round" fill="none"/>

      <!-- Tiny Dream Engineer Wrench / Wand -->
      <g transform="translate(68, 46) rotate(25)">
        <rect x="0" y="0" width="6" height="22" rx="3" fill="#cbd5e1"/>
        <circle cx="3" cy="2" r="5" fill="#38bdf8"/>
      </g>

      <!-- Speech Bubble: "Hi, I'm Pip!" -->
      <g transform="translate(98, 12)">
        <path d="M 0 16 L 10 16 L 8 26 Z" fill="rgba(255,255,255,0.95)"/>
        <rect x="4" y="0" width="138" height="42" rx="12" fill="rgba(255,255,255,0.95)" filter="url(#glow)"/>
        <text x="14" y="18" fill="#1e1b4b" font-family="'Manrope', sans-serif" font-size="11.5" font-weight="800">"Welcome to PipOS!</text>
        <text x="14" y="32" fill="#6366f1" font-family="'Manrope', sans-serif" font-size="10.5" font-weight="700">Ready to build dreams?"</text>
      </g>

      <!-- Interactive Indicators below Pip -->
      <g transform="translate(100, 64)">
        <rect x="0" y="0" width="142" height="24" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.14)"/>
        <circle cx="12" cy="12" r="4" fill="#10b981"/>
        <text x="24" y="16" fill="#e2e8f0" font-family="'Manrope', sans-serif" font-size="10" font-weight="700">Voice Companion Active</text>
      </g>
    </g>
  </g>

  <!-- Clean Subtle Border -->
  <rect x="0.5" y="0.5" width="599" height="299" rx="0" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
</svg>
